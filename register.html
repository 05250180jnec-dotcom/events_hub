<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- unchanged -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- unchanged -->
  <title>JNEC Events Hub — Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Your CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header styled with Bootstrap -->
  <header id="top" class="bg-dark text-white py-3"> <!-- added bg-dark, text-white, py-3 -->
    <div class="container"> <!-- added container for spacing -->
      <h1 class="mb-0">JNEC Events Hub</h1> <!-- added mb-0 -->
      <nav class="mt-2"> <!-- added mt-2 -->
        <a href="index.html" class="text-white me-3">Home</a> <!-- added text-white, me-3 -->
        <a href="events.html" class="text-white me-3">Events</a>
        <a href="register.html" class="text-white me-3">Register</a>
        <a href="gallery.html" class="text-white me-3">Gallery</a>
        <a href="contact.html" class="text-white">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container py-4"> <!-- added container, py-4 -->
      <h2 class="mb-4">Event Registration</h2> <!-- added mb-4 -->

      <form action="#" method="post" enctype="multipart/form-data" id="regForm" class="needs-validation"> <!-- added needs-validation -->
        
        <!-- Personal Details -->
        <fieldset class="mb-4 border p-3 rounded"> <!-- added mb-4, border, p-3, rounded -->
          <legend class="fw-bold">Personal Details</legend> <!-- added fw-bold -->

          <div class="mb-3"> <!-- added mb-3 -->
            <label for="fullname" class="form-label">Full name</label> <!-- added form-label -->
            <input type="text" class="form-control" id="fullname" name="fullname"> <!-- added form-control -->
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="text" class="form-control" id="email" name="email">
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone">
          </div>
        </fieldset>

        <!-- Event Choice -->
        <fieldset class="mb-4 border p-3 rounded">
          <legend class="fw-bold">Event Choice</legend>

          <div class="mb-3">
            <label for="event_id" class="form-label">Event</label>
            <select class="form-select" id="event_id" name="event_id"> <!-- added form-select -->
              <option value="">-- choose an event --</option>
              <option value="1">Tech Week Hackathon</option>
              <option value="2">Losar Festival Night</option>
              <option value="3">Inter-College Football</option>
            </select>
          </div>

          <p class="fw-semibold">Food preference:</p> <!-- added fw-semibold -->
          <div class="form-check"> <!-- wrapped in form-check -->
            <input class="form-check-input" type="radio" id="veg" name="food" value="veg"> <!-- added form-check-input -->
            <label class="form-check-label" for="veg">Vegetarian</label> <!-- added form-check-label -->
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" id="nonveg" name="food" value="nonveg">
            <label class="form-check-label" for="nonveg">Non-vegetarian</label>
          </div>

          <p class="fw-semibold">Interested in:</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="volunteer" name="interests" value="volunteer">
            <label class="form-check-label" for="volunteer">Volunteering</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="perform" name="interests" value="perform">
            <label class="form-check-label" for="perform">Performing</label>
          </div>
        </fieldset>

        <!-- Other -->
        <fieldset class="mb-4 border p-3 rounded">
          <legend class="fw-bold">Other</legend>

          <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select class="form-select" id="department" name="department">
              <option value="it">Information Technology</option>
              <option value="civil">Civil</option>
              <option value="electrical">Electrical</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="remarks" class="form-label">Remarks</label>
            <textarea class="form-control" id="remarks" name="remarks" rows="4"></textarea>
          </div>

          <div class="mb-3">
            <label for="id_card" class="form-label">Student ID card (image)</label>
            <input class="form-control" type="file" id="id_card" name="id_card">
          </div>
        </fieldset>

        <!-- Buttons styled with Bootstrap -->
        <button type="submit" class="btn btn-primary me-2">Register</button> <!-- added btn btn-primary me-2 -->
        <button type="reset" class="btn btn-outline-secondary">Clear</button> <!-- added btn btn-outline-secondary -->
      </form>
    </div>
  </main>

  <!-- Footer styled with Bootstrap -->
  <footer class="bg-dark text-white text-center py-3 mt-4"> <!-- added bg-dark, text-white, text-center, py-3, mt-4 -->
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
